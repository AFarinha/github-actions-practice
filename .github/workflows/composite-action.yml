name: Composite Action Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  greet:
    name: Run setup and greet action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Greet user
        id: greeting
        uses: ./.github/actions/setup-and-greet
        with:
          name: DevOps learner
          language: en

      - name: Print action output
        env:
          GREETED: ${{ steps.greeting.outputs.greeted }}
        run: echo "Composite action completed:${GREETED}"
