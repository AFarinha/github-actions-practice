name: Run Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run test suite
        run: python -m pytest -q
