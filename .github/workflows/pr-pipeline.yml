name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  build-test:
    name: Run PR build and tests
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: "3.12"
      run_tests: true

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check dependencies for vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical

  pr-comment:
    name: Print PR summary
    needs:
      - build-test
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Print successful PR summary
        env:
          PR_BRANCH: ${{ github.head_ref }}
          TEST_RESULT: ${{ needs.build-test.outputs.test_result }}
        run: |
          echo "PR checks passed for branch: ${PR_BRANCH}"
          echo "Test result: ${TEST_RESULT}"
